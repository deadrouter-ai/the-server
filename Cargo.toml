[package]
name = "the-server"
version = "0.0.1"
edition = "2024"
rust-version = "1.91"
license = "Apache-2.0"
readme = "README.md"

[dependencies]
# Async & Concurrency
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["io"] }
futures = "0.3"
async-stream = "0.3"

# HTTP & Web
hyper = { version = "1", features = ["full"] }
hyper-util = { version = "0.1", features = ["full"] }
http-body-util = "0.1"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "http2", "json", "stream"] }

# QUIC & HTTP/3
s2n-quic = { version = "1.81", default-features = false, features = ["provider-tls-rustls", "provider-address-token-default"] }
s2n-quic-h3 = "0.1"
h3 = "0.0.8"

# TLS & Cryptography
rustls = { version = "0.23", default-features = false, features = ["std", "aws_lc_rs", "fips"] }
tokio-rustls = "0.26"
rcgen = { version = "0.14", default-features = false, features = ["aws_lc_rs", "fips", "pem"] }
aws-lc-rs = { version = "1.17", features = ["fips"] }
webpki-roots = "1"
chacha20 = { version = "0.10", features = ["xchacha"] }
poly1305 = "0.9"
chacha20poly1305 = "0.11"
curve25519-dalek = "5"
x25519-dalek = { version = "3", features = ["static_secrets"] }
x509-parser = "0.18"
zeroize = "1"
dnscrypt = "0.1"
tinfoil = { git = "https://github.com/tinfoilsh/tinfoil-rs" }

# Tor / Arti
arti-client = { version = "0.44", default-features = false, features = ["onion-service-service", "rustls", "tokio", "vanguards", "compression", "static-sqlite"] }
tor-hsservice = "0.44"
tor-cell = "0.44"
safelog = "0.9"
fs-mistrust = "0.15"

# Serialization & Encoding
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64ct = { version = "1", features = ["alloc"] }
base16ct = { version = "1", features = ["alloc"] }

# Utilities & Misc
bytes = "1"
mimalloc = { version = "*", features = ["secure"] }
tempfile = "3"
askama = "0.16"
dcap-qvl = "0.5"
flate2 = "1"

dotenvy = { version = "0.15", optional = true }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
regex = "1"

[build-dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
default = []
development = ["dotenvy"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
