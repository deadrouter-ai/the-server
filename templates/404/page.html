<!DOCTYPE html>
<html lang="{{ self.locale.code() }}">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="robots" content="noindex, nofollow">
    <meta name="theme-color" content="#060404" />

    <title>{{ self.t("notfound_title") }}</title>
    <style>{% include "style.css" %}</style>
</head>

<body>

    <div class="void-container">
        <main class="void-content">
            <div class="gothic-sigil">✠</div>
            <h1 class="void-title">404</h1>
            <h2 class="void-subtitle">{{ self.t("notfound_subtitle") }}</h2>
            <div class="gothic-divider"></div>
            <p class="void-description">
                {{ self.t("notfound_desc") }}
            </p>
            <div class="void-actions">
                <a href="{{ self.locale.home_href() }}" class="btn">{{ self.t("notfound_link") }}</a>
            </div>
        </main>
    </div>

</body>
</html>
